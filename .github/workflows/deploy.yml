# Deploy su Render a ogni push su main.
#
# Render puo' anche auto-deployare da solo collegando il repo, ma tenere il trigger qui rende
# esplicito quando e perche' parte un deploy, e lascia lo spazio per aggiungere prima dei
# controlli bloccanti (qui: i test devono passare, altrimenti il deploy non parte).
name: Deploy su Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Chiama il Deploy Hook di Render
        # L'URL del hook e' un segreto: chi lo possiede puo' far partire un deploy.
        #
        # Se il secret non e' configurato, curl riceverebbe una stringa vuota e uscirebbe con
        # codice 3 (URL malformato), colorando di rosso un workflow che in realta' non ha
        # nulla di rotto. Meglio dirlo e fermarsi: Render resta comunque in grado di
        # auto-deployare da solo se il repo e' collegato.
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK non configurato: deploy non richiesto da qui."
            exit 0
          fi
          curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK"
          echo "Deploy richiesto a Render."
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
